name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif ! git cat-file -e "${PUSH_BEFORE:-0}^{commit}" 2>/dev/null; then
            # New branch, or a force-push whose old tip is gone:
            # check only the commits not yet on the default branch.
            base=origin/$DEFAULT_BRANCH
          else
            base=$PUSH_BEFORE
          fi
          scripts/check-commits.sh "$base" HEAD

  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Uses the toolchain line in go.mod, the same Go version local runs switch to.
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - run: make lint
      - run: make test
      - run: make build
