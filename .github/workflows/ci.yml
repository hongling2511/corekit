name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            # New branch: check only the commits not yet on the default branch.
            base=origin/$DEFAULT_BRANCH
          else
            base=$PUSH_BEFORE
          fi
          scripts/check-commits.sh "$base" HEAD

  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Latest patch of the go.mod minor version, so govulncheck sees a patched standard library.
          go-version: "1.26.x"
      - run: make lint
      - run: make test
      - run: make build
