        # httpx: capability, foundation and third-party; no other role package.
        role-httpx:
          list-mode: lax
          files:
            - "${config-path}/httpx/**"
          deny:
            - pkg: github.com/hongling2511/corekit/grpcx$
              desc: role packages must not import each other
            - pkg: github.com/hongling2511/corekit/grpcx/
              desc: role packages must not import each other
            - pkg: github.com/hongling2511/corekit/worker$
              desc: role packages must not import each other
            - pkg: github.com/hongling2511/corekit/worker/
              desc: role packages must not import each other
            - pkg: github.com/hongling2511/corekit/cron$
              desc: role packages must not import each other
            - pkg: github.com/hongling2511/corekit/cron/
              desc: role packages must not import each other
        # grpcx: capability, foundation and third-party; no other role package.
        role-grpcx:
