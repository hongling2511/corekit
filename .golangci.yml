version: "2"

linters:
  enable:
    - depguard
  settings:
    depguard:
      # Layering: role -> capability -> foundation. Imports only point downward;
      # packages in the same role or capability layer do not import each other.
      # File globs are anchored to this config file's directory (the module root).
      # A trailing "$" makes an entry an exact match; a trailing "/" admits subpackages.
      rules:
        # Standalone foundation packages: stdlib, cobra/pflag/viper, each other; never app.
        foundation:
          list-mode: strict
          files:
            - "${config-path}/config/**"
            - "${config-path}/log/**"
            - "${config-path}/errx/**"
            - "${config-path}/version/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/spf13/cobra$
            - github.com/spf13/pflag$
            - github.com/spf13/viper$
            - github.com/hongling2511/corekit/config$
            - github.com/hongling2511/corekit/config/
            - github.com/hongling2511/corekit/log$
            - github.com/hongling2511/corekit/log/
            - github.com/hongling2511/corekit/errx$
            - github.com/hongling2511/corekit/errx/
            - github.com/hongling2511/corekit/version$
            - github.com/hongling2511/corekit/version/
        # Their tests: the same plus testify; still never app, so each stays usable on its own.
        foundation-test:
          list-mode: strict
          files:
            - "${config-path}/config/**_test.go"
            - "${config-path}/log/**_test.go"
            - "${config-path}/errx/**_test.go"
            - "${config-path}/version/**_test.go"
          allow:
            - $gostd
            - github.com/spf13/cobra$
            - github.com/spf13/pflag$
            - github.com/spf13/viper$
            - github.com/stretchr/testify/
            - github.com/hongling2511/corekit/config$
            - github.com/hongling2511/corekit/config/
            - github.com/hongling2511/corekit/log$
            - github.com/hongling2511/corekit/log/
            - github.com/hongling2511/corekit/errx$
            - github.com/hongling2511/corekit/errx/
            - github.com/hongling2511/corekit/version$
            - github.com/hongling2511/corekit/version/
        # app (the start-up pipeline) may also use the standalone foundation packages.
        app:
          list-mode: strict
          files:
            - "${config-path}/app/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/spf13/cobra$
            - github.com/spf13/pflag$
            - github.com/spf13/viper$
            - github.com/hongling2511/corekit/app$
            - github.com/hongling2511/corekit/app/
            - github.com/hongling2511/corekit/config$
            - github.com/hongling2511/corekit/config/
            - github.com/hongling2511/corekit/log$
            - github.com/hongling2511/corekit/log/
            - github.com/hongling2511/corekit/errx$
            - github.com/hongling2511/corekit/errx/
            - github.com/hongling2511/corekit/version$
            - github.com/hongling2511/corekit/version/
        # app's tests: the same plus testify.
        app-test:
          list-mode: strict
          files:
            - "${config-path}/app/**_test.go"
          allow:
            - $gostd
            - github.com/spf13/cobra$
            - github.com/spf13/pflag$
            - github.com/spf13/viper$
            - github.com/stretchr/testify/
            - github.com/hongling2511/corekit/app$
            - github.com/hongling2511/corekit/app/
            - github.com/hongling2511/corekit/config$
            - github.com/hongling2511/corekit/config/
            - github.com/hongling2511/corekit/log$
            - github.com/hongling2511/corekit/log/
            - github.com/hongling2511/corekit/errx$
            - github.com/hongling2511/corekit/errx/
            - github.com/hongling2511/corekit/version$
            - github.com/hongling2511/corekit/version/
        # middleware: foundation and third-party only; no role package, no other capability package.
        capability-middleware:
          list-mode: lax
          files:
            - "${config-path}/middleware/**"
          deny:
            - pkg: github.com/hongling2511/corekit/httpx$
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/httpx/
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/grpcx$
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/grpcx/
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/worker$
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/worker/
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/cron$
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/cron/
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/auth$
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/auth/
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/db$
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/db/
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/redisx$
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/redisx/
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/obs$
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/obs/
              desc: capability packages must not import each other
        # auth: foundation and third-party only; no role package, no other capability package.
        capability-auth:
          list-mode: lax
          files:
            - "${config-path}/auth/**"
          deny:
            - pkg: github.com/hongling2511/corekit/httpx$
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/httpx/
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/grpcx$
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/grpcx/
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/worker$
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/worker/
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/cron$
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/cron/
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/middleware$
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/middleware/
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/db$
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/db/
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/redisx$
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/redisx/
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/obs$
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/obs/
              desc: capability packages must not import each other
        # db: foundation and third-party only; no role package, no other capability package.
        capability-db:
          list-mode: lax
          files:
            - "${config-path}/db/**"
          deny:
            - pkg: github.com/hongling2511/corekit/httpx$
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/httpx/
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/grpcx$
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/grpcx/
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/worker$
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/worker/
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/cron$
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/cron/
              desc: capability layer must not import the role layer
            - pkg: github.com/hongling2511/corekit/middleware$
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/middleware/
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/auth$
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/auth/
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/redisx$
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/redisx/
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/obs$
              desc: capability packages must not import each other
            - pkg: github.com/hongling2511/corekit/obs/
              desc: capability packages must not import each other
        # redisx: foundation and third-party only; no role package, no other capability package.
        capability-redisx:
          list-mode: lax
